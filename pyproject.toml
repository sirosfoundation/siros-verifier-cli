[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "siros-verifier-cli"
version = "0.1.0"
description = "Commandline ISO/IEC 18013-5 BLE proximity verifier for debugging mdoc device retrieval"
readme = "README.md"
license = { text = "BSD-2-Clause" }
requires-python = ">=3.10"
dependencies = [
    "bleak>=0.21",
    "cbor2>=5.6",
    "cryptography>=42",
]

[project.optional-dependencies]
qr = ["pyzbar>=0.1.9", "Pillow>=10"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
siros-verify = "siros_verifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
