[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "siros-verifier-cli"
version = "0.1.0"
description = "Commandline ISO/IEC 18013-5 BLE proximity verifier for debugging mdoc device retrieval"
readme = "README.md"
license = { text = "BSD-2-Clause" }
requires-python = ">=3.10"
dependencies = [
    "bleak>=0.21",
    "cbor2>=5.6",
    "cryptography>=42",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/sirosfoundation/siros-verifier-cli"
Repository = "https://github.com/sirosfoundation/siros-verifier-cli"
Issues = "https://github.com/sirosfoundation/siros-verifier-cli/issues"

[project.optional-dependencies]
qr = ["pyzbar>=0.1.9", "Pillow>=10", "qrcode>=7.4"]
camera = ["pyzbar>=0.1.9", "Pillow>=10", "opencv-python-headless>=4.9"]
peripheral = ["bless>=0.3"]  # ble_peripheral.py's write_request_func/read_request_func dispatch is verified against 0.3.0's single-callback API
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "qrcode>=7.4", "Pillow>=10"]

[project.scripts]
siros-verify = "siros_verifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
